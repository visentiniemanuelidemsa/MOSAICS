<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor Ortomosaico Drone</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body, html, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/georaster"></script>
  <script src="https://unpkg.com/georaster-layer-for-leaflet"></script>

  <script>
    const map = L.map('map').setView([0, 0], 2);

    // Mapa base Satelital sin requerimiento de API Key
    L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxZoom: 21,
      attribution: 'Tiles &copy; Esri'
    }).addTo(map);

    const cogUrl = 'https://github.com/visentinemanuelidemsa/MOSAICS/releases/download/UAV/RGB-10cm-orthophoto_cog_jpeg.tif';

    parseGeoraster(cogUrl).then(georaster => {
      const layer = new GeoRasterLayer({
        georaster: georaster,
        opacity: 1,
        resolution: 256
      });
      layer.addTo(map);
      map.fitBounds(layer.getBounds());
    }).catch(err => console.error("Error al cargar el COG:", err));
  </script>
</body>
</html>
