<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visor Ortomosaico Drone</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css" />
  <style>
    html, body, #map { width: 100%; height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>
  <script>
    // 1. Capa base satelital Esri World Imagery
    const baseLayer = new ol.layer.Tile({
      source: new ol.source.XYZ({
        url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
        maxZoom: 21
      })
    });

    // 2. Capa COG directa desde el asset de GitHub Releases
    const cogSource = new ol.source.GeoTIFF({
      sources: [
        {
          url: 'https://github.com/visentinemanuelidemsa/MOSAICS/releases/download/UAV/RGB-10cm-orthophoto_cog_jpeg.tif'
        }
      ],
      convertToRGB: true
    });

    const cogLayer = new ol.layer.WebGLTile({
      source: cogSource
    });

    // 3. Inicialización del mapa
    const map = new ol.Map({
      target: 'map',
      layers: [baseLayer, cogLayer],
      view: new ol.View({
        center: [0, 0],
        zoom: 2
      })
    });

    // 4. Centrado y zoom automático sobre el ortomosaico
    cogSource.getView().then(viewConfig => {
      map.setView(new ol.View(viewConfig));
    }).catch(err => {
      console.error("Error al obtener la vista del COG:", err);
    });
  </script>
</body>
</html>
